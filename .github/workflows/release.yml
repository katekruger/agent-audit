name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      testpypi-only:
        description: "Publish to TestPyPI only (dry run), skip the real PyPI publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Full CI must pass before anything gets built for release.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build sdist and wheel
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache here (unlike ci.yml): this job's output is
      # published to PyPI, and zizmor flags a build/publish workflow that
      # restores a cache as a cache-poisoning vector.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build
        working-directory: py
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: py/dist/
          if-no-files-found: error

  # Every release — real or dry-run — goes to TestPyPI first. This is the
  # "test with a TestPyPI dry run" step: it proves the OIDC Trusted Publisher
  # config and the built artifacts actually work before anything touches the
  # real index.
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agent-audit-record
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    # Skip on a manual dry run; only a real tag push reaches the real index.
    # The `pypi` GitHub Environment should additionally be configured with
    # required reviewers, so this step also waits on manual approval.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-audit-record
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
      attestations: write # required for PEP 740 Sigstore attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
