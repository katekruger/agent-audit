name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install
        working-directory: py
        run: uv sync --locked

      - name: ruff check
        working-directory: py
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: py
        run: uv run ruff format --check .

      - name: pyright
        working-directory: py
        run: uv run pyright

      - name: pytest (with coverage)
        working-directory: py
        run: |
          uv run coverage run -m pytest
          uv run coverage report -m

  validate-examples:
    name: Validate examples against JSON Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Validate every example
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for f in examples/**/*.json; do
            echo "Validating $f"
            uv run --with jsonschema python scripts/validate_example.py \
              spec/schema/v1/agent-audit.schema.json "$f"
          done

      - name: Smoke-test the flagship example (no OTLP endpoint required)
        working-directory: examples/denied-proposal
        run: uv run --project ../../py --group examples python run.py

      - name: Smoke-test the Claude Code hooks receiver
        run: uv run --project py python integrations/claude-code-hooks/verify_receiver.py
